<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fișă interactivă – Înmulțirea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg1:#0f3d52;--bg2:#1b1f55;--ink:#eef3ff;--pill:#0e1a3f;--pillink:#ffd76a;--card:#f7f3ea;--cardink:#1a2240;--chip:#2f4468;--ok:#16a34a;--bad:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#0f3d52;--bg2:#1b1f55;--ink:#eef3ff}}
:root[data-theme="dark"]{--bg1:#0f3d52;--bg2:#1b1f55;--ink:#eef3ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:14px;text-align:center}
.logo{width:90px;height:90px;border-radius:50%}
h1{margin:4px 0;font-size:clamp(1.8rem,6vw,3rem);line-height:1.1;color:#ffd23f;text-shadow:0 3px 0 #a07a00}
.sub{margin:4px 0 12px}
.orow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.orow>span{min-width:140px;text-align:right;font-size:1.05rem}
.chip{border:0;border-radius:999px;padding:4px 18px;font:inherit;font-size:1.1rem;font-weight:800;background:var(--chip);color:#fff;cursor:pointer}
.chip.sel{background:#e8c53a;color:#1d1d4d}
.btn{border:0;border-radius:999px;padding:8px 24px;font:inherit;font-size:1.1rem;font-weight:800;background:#ffd23f;color:#25235a;cursor:pointer;box-shadow:0 4px 0 #b8900f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b8900f}
.btn.alt{background:#cfe0ff;box-shadow:0 4px 0 #6f87b8}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:16px 0}
.pill{background:var(--pill);color:var(--pillink);border:2px solid #f5c04a;border-radius:999px;padding:4px 16px;font-weight:700}
#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;text-align:left}
.ex{background:var(--card);color:var(--cardink);border:4px solid #7b8bb8;border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ex.ok{border-color:var(--ok)}.ex.bad{border-color:var(--bad)}
.n{background:#25235a;color:#ffd23f;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.q{font:800 1.5rem ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.ex input{flex:1;min-width:110px;max-width:100%;font:800 1.4rem ui-monospace,Menlo,Consolas,monospace;border:3px dashed #9aa9cf;border-radius:8px;padding:4px 8px;color:var(--cardink);background:#fff}
.mark{font-size:1.4rem;font-weight:800;width:1.4rem}
.ok .mark{color:var(--ok)}.bad .mark{color:var(--bad)}
.tag{flex-basis:100%;font-size:.8rem;color:#55608a}
.sol{flex-basis:100%;font-weight:800;color:var(--ok)}
</style>
</head>

<h1>ÎNMULȚIREA – FIȘĂ INTERACTIVĂ</h1>
<div class="sub">Alege factorii și tipul de calcul, apoi rezolvă exercițiile</div>
<div class="orow"><span>Factorul 1</span><span id="gA" style="min-width:0"></span></div>
<div class="orow"><span>Factorul 2</span><span id="gB" style="min-width:0"></span></div>
<div class="orow"><span>Trecere peste ordin</span><span id="gC" style="min-width:0"></span></div>
<div class="bar"><button class="btn" onclick="check()">Verifică</button><button class="btn alt" onclick="reveal()">Arată răspunsurile</button><button class="btn alt" onclick="gen()">Exerciții noi</button><span class="pill" id="score">Scor: –</span></div>
<div id="list"></div>
</div>
<script>
var S={a:3,b:1,c:"mix"},EX=[],N=8;
function $(i){return document.getElementById(i)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function dg(x){return String(x).split("").reverse().map(Number)}
function fmt(x){var s=String(x);return s.length>=5?s.replace(/\B(?=(\d{3})+(?!\d))/g,"\u202F"):s}
function carries(a,b){
  var da=dg(a),db=dg(b),i,k;
  for(i=0;i<db.length;i++)if(db[i])for(k=0;k<da.length;k++)if(da[k]*db[i]>=10)return true;
  if(db.length==2)for(k=0;k<=da.length;k++){var v=(da[k]||0)*db[0]+(k?(da[k-1]||0)*db[1]:0);if(v>=10)return true}
  return false;
}
function build(n,mx){var s="";for(var i=0;i<n;i++)s+=rnd(i?0:1,mx);return Number(s)}
function noCarry(n,m){
  for(var t=0;t<400;t++){
    var u=m==1?rnd(2,9):rnd(1,3),tn=rnd(1,3),b=m==1?u:tn*10+u,mx=Math.floor(9/(m==1?u:Math.max(u,tn)));
    if(mx<(n==1?2:1))continue;
    var a=build(n,mx);if(n==1&&a<2)continue;
    if(!carries(a,b))return [a,b];
  }
  return [build(n,4),m==1?2:11];
}
function withCarry(n,m){
  for(;;){
    var a=build(n,9),b=m==1?rnd(2,9):rnd(1,9)*10+rnd(1,9);
    if(carries(a,b))return [a,b];
  }
}
function gen(){
  EX=[];
  for(var i=0;i<N;i++){
    var c=S.c=="mix"?(Math.random()<.5?"cu":"fara"):S.c,p=c=="cu"?withCarry(S.a,S.b):noCarry(S.a,S.b);
    EX.push({a:p[0],b:p[1],ans:p[0]*p[1],val:"",st:"",show:false,c:c});
  }
  $("score").textContent="Scor: –";draw();
}
function chips(id,key,vals,labels){
  $(id).innerHTML=vals.map(function(v,i){return '<button class="chip'+(S[key]==v?" sel":"")+'" onclick="S.'+key+'='+(typeof v=="string"?"\x27"+v+"\x27":v)+';ui();gen()">'+labels[i]+'</button>'}).join(" ");
}
function ui(){
  chips("gA","a",[1,2,3,4,5,6],["1 cifră","2 cifre","3 cifre","4 cifre","5 cifre","6 cifre"]);
  chips("gB","b",[1,2],["1 cifră","2 cifre"]);
  chips("gC","c",["fara","cu","mix"],["Fără trecere","Cu trecere","Amestecat"]);
}
function draw(){
  $("list").innerHTML=EX.map(function(e,i){
    return '<div class="ex '+e.st+'"><span class="n">'+(i+1)+'</span><span class="q">'+fmt(e.a)+' × '+fmt(e.b)+' =</span><input inputmode="numeric" autocomplete="off" aria-label="Răspuns exercițiul '+(i+1)+'" value="'+e.val+'" oninput="EX['+i+'].val=this.value"><span class="mark">'+(e.st=="ok"?"✓":e.st=="bad"?"✗":"")+'</span><span class="tag">'+(e.c=="cu"?"cu trecere peste ordin":"fără trecere peste ordin")+'</span>'+(e.show?'<span class="sol">Răspuns: '+fmt(e.ans)+'</span>':"")+'</div>';
  }).join("");
}
function check(){
  var ok=0;
  EX.forEach(function(e){var v=e.val.replace(/\D/g,"");e.st=v===""?"":(v===String(e.ans)?"ok":"bad");if(e.st=="ok")ok++});
  $("score").textContent="Corecte: "+ok+" / "+N;draw();
}
function reveal(){EX.forEach(function(e){e.show=true});draw()}
ui();gen();
</script>
